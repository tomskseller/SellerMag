# Nginx-конфиг для продакшена.
# TODO на этапе деплоя: заменить sellermag.ru на реальный домен и
# добавить SSL-блок (certbot certonly --webroot ...), см. README в infra/.

server {
    listen 80;
    server_name sellermag.ru www.sellermag.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
